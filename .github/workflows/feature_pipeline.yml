name: Feature Pipeline — Hourly Live Forecast

on:
  schedule:
    - cron: "0 * * * *"   # every hour at :00
  workflow_dispatch:       # also allow manual trigger from GitHub UI

jobs:
  refresh-forecast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pearl_intern   # adjust if your repo root differs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch live weather forecast
        run: python forecast_weather.py
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}

      - name: Fetch live air quality forecast
        run: python forecast_air_quality.py
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}

      - name: Generate 3-day AQI prediction
        run: python forecast_prediction.py

      - name: Commit updated forecast CSVs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/weather_forecast.csv \
                  data/processed/air_quality_forecast.csv \
                  data/processed/aqi_forecast.csv \
                  data/processed/current_air_quality.csv
          git diff --cached --quiet || git commit -m "auto: refresh live forecast $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
