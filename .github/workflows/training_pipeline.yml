name: Training Pipeline — Daily (Hopsworks)

on:
  schedule:
    - cron: "0 1 * * *"   # 1 AM UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  training-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── FIX: detect where the Python files actually are ──────────────
      - name: Detect project root
        id: find_root
        run: |
          if [ -f "hopsworks_training_pipeline.py" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
            echo "Found scripts at repo root"
          elif [ -f "pearl/hopsworks_training_pipeline.py" ]; then
            echo "PROJECT_DIR=pearl" >> $GITHUB_ENV
            echo "Found scripts in pearl/ subfolder"
          else
            echo "Searching for hopsworks_training_pipeline.py..."
            FOUND=$(find . -name "hopsworks_training_pipeline.py" | head -1)
            if [ -n "$FOUND" ]; then
              DIR=$(dirname "$FOUND")
              echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
              echo "Found at: $FOUND"
            else
              echo "ERROR: hopsworks_training_pipeline.py not found in repo"
              find . -name "*.py" | head -20
              exit 1
            fi
          fi

      - name: Install dependencies
        run: |
          cd $PROJECT_DIR
          if [ -f requirements.txt ]; then
            echo "Installing from requirements.txt …"
            pip install -r requirements.txt
          else
            echo "No requirements.txt found — installing core packages …"
            pip install pandas scikit-learn joblib python-dotenv hopsworks torch
          fi
          # Always ensure torch is present (replaces tensorflow)
          python -c "import torch; print('PyTorch:', torch.__version__)" || pip install torch
          python -c "import hopsworks; print('Hopsworks OK')" || pip install hopsworks

      - name: Run Hopsworks Training Pipeline
        run: |
          cd $PROJECT_DIR
          python hopsworks_training_pipeline.py
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}

      - name: Regenerate SHAP explanations
        continue-on-error: true
        run: |
          cd $PROJECT_DIR
          python shap_explain.py

      - name: Commit updated models and registry
        run: |
          cd $PROJECT_DIR
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models/ data/registry/ data/eda/ data/processed/ || true
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "auto: daily retrain $(date -u '+%Y-%m-%d')"
          git push