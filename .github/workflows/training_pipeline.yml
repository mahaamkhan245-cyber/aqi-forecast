name: Training Pipeline — Daily (Hopsworks)

on:
  schedule:
    - cron: "0 1 * * *"   # 1 AM UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  training-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas scikit-learn joblib python-dotenv hopsworks tensorflow
          fi

      - name: Run Hopsworks Training Pipeline
        run: python hopsworks_training_pipeline.py
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}

      - name: Regenerate SHAP explanations
        continue-on-error: true
        run: python shap_explain.py

      - name: Commit updated models and registry
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models/ data/registry/ data/eda/ data/processed/ || true
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "auto: daily retrain $(date -u '+%Y-%m-%d')"
          git push
