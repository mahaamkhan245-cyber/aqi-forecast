name: Training Pipeline — Daily (Hopsworks)

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  training-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyTorch CPU-only first
        # CPU-only version is ~200MB vs ~2GB for CUDA version
        # Must be installed BEFORE requirements.txt to avoid CUDA pull
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas scikit-learn joblib python-dotenv
            pip install "hopsworks[python]" confluent-kafka
            pip install shap matplotlib plotly streamlit flask
          fi

      - name: Run Training Pipeline
        run: |
          if [ -f "hopsworks_training_pipeline.py" ]; then
            echo "Running hopsworks_training_pipeline.py …"
            python hopsworks_training_pipeline.py
          elif [ -f "train_model_comparison.py" ]; then
            echo "Falling back to train_model_comparison.py …"
            python train_model_comparison.py
          else
            echo "ERROR: No training script found"
            exit 1
          fi
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}

      - name: Regenerate SHAP explanations
        continue-on-error: true
        run: |
          if [ -f "shap_explain.py" ]; then
            python shap_explain.py
          fi

      - name: Commit updated models and registry
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models/ data/registry/ data/eda/ data/processed/ || true
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "auto: daily retrain $(date -u '+%Y-%m-%d')"
          git push